name: Docker Email Pipeline

on:
  push:
    paths:
      - "*.png"
      - "*.jpg"
      - "*.jpeg"

jobs:
  send-image:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Detect image file
        id: get_image
        run: |
          echo "DEBUG: Checking previous commits..."

          # Detect if HEAD~1 exists (repo has more than one commit)
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "DEBUG: Previous commit found."
            FILE=$(git diff --name-only HEAD~1 HEAD | grep -E "\.(png|jpg|jpeg)$" | head -n 1)
          else
            echo "DEBUG: First commit detected."
            FILE=$(git ls-files | grep -E "\.(png|jpg|jpeg)$" | head -n 1)
          fi

          echo "DEBUG: Detected image file = $FILE"

          if [ -z "$FILE" ]; then
            echo "ERROR: No image file found."
            exit 1
          fi

          echo "image=$FILE" >> $GITHUB_OUTPUT

      - name: Show selected image file
        run: |
          echo "DEBUG: Selected image is:"
          echo "${{ steps.get_image.outputs.image }}"

      - name: Build Docker image
        run: |
          echo "DEBUG: Building Docker image..."
          docker build -t email-sender .

      - name: List repository contents
        run: |
          echo "DEBUG: Listing repository files..."
          ls -R .

      - name: Run Docker container to send email
        run: |
          echo "DEBUG: Running container with image path: ${{ steps.get_image.outputs.image }}"
          docker run \
            -e SMTP_SERVER="${{ secrets.SMTP_SERVER }}" \
            -e SMTP_PORT="${{ secrets.SMTP_PORT }}" \
            -e SMTP_USERNAME="${{ secrets.SMTP_USERNAME }}" \
            -e SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
            -e SEND_TO="${{ secrets.SEND_TO }}" \
            -e IMAGE_PATH="${{ steps.get_image.outputs.image }}" \
            email-sender

